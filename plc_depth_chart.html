<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLC Depth Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#98CEC8;
    --charcoal:#4D4D4D;
    --charcoal-dark:#333333;
    --muted:#7F8C8D;
    --hairline:#E5E5E5;
    --cream:#FEF3E4;
    --mint:#D5EAE7;
    --sky:#A3CCEF;
    --lavender-bg:#BAB6DA;
    --white:#FFFFFF;
    --p-sunflower:#F2BE61;
    --p-morningglory:#B1DED2;
    --p-lavender:#B2AECB;
    --p-poppy:#EA8266;
    --p-bellsofireland:#A4D28A;
    --p-rose:#EFC0BC;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:
      radial-gradient(ellipse 1000px 800px at 50% 48%, var(--mint) 0%, rgba(213,234,231,0) 60%),
      var(--white);
    color:var(--charcoal);
    font-family:'Montserrat',Arial,sans-serif;
    overflow:hidden;
  }
  .app{ position:relative; width:100%; height:100vh; min-height:560px; }

  .masthead{
    position:absolute; top:0; left:0; width:100%;
    padding:22px 30px 0 30px;
    z-index:20; pointer-events:none;
    display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
  }
  .masthead .brandmark{ height:24px; width:auto; display:block; margin-top:4px; }
  .masthead .titleblock{ text-align:right; }
  .masthead .eyebrow{
    font-family:'Montserrat',sans-serif; font-weight:600;
    font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--teal); margin:0 0 3px 0;
  }
  .masthead h1{
    font-family:'Playfair Display',Georgia,serif; font-weight:900;
    font-size:clamp(20px,2.6vw,30px); margin:0; color:var(--charcoal-dark);
  }
  .masthead p.sub{
    font-family:'Montserrat',sans-serif; font-weight:500; font-size:11.5px; color:var(--muted);
    margin:5px 0 0 0; max-width:340px; line-height:1.5; text-align:right;
  }

  .footer-credit{
    position:absolute; bottom:14px; left:0; width:100%; text-align:center;
    z-index:5; pointer-events:none;
  }
  .footer-credit .tagline{
    font-family:'Playfair Display',serif; font-style:italic; font-weight:400;
    font-size:12px; color:var(--muted); margin:0;
  }
  .footer-credit .fineprint{
    font-family:'Montserrat',sans-serif; font-weight:500; font-size:9px; letter-spacing:0.06em;
    text-transform:uppercase; color:#B9C4C3; margin:3px 0 0 0;
  }

  .legend{
    position:absolute; bottom:16px; left:24px; z-index:20;
    font-family:'Montserrat',sans-serif; font-size:10.5px; color:var(--charcoal);
    display:flex; flex-direction:column; gap:7px;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(3px);
    padding:11px 13px; border:1px solid var(--hairline); border-radius:6px;
    box-shadow:0 4px 18px rgba(77,77,77,0.08);
    max-width:210px;
  }
  .legend .group-title{ font-weight:700; font-size:9px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin:0 0 1px 0;}
  .legend .row{display:flex; align-items:center; gap:7px; line-height:1.25;}
  .legend .sw{width:9px; height:9px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,0.06);}
  .legend .divider{height:1px; background:var(--hairline); margin:2px 0;}

  .scene{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-top:26px; }
  .orbit-plane{ position:relative; width:1px; height:1px; }

  .ring-path{
    position:absolute; top:50%; left:50%; border-radius:50%;
    border:1px dashed var(--hairline);
    transform:translate(-50%,-50%);
    pointer-events:none;
  }

  .center-mark{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:5; border-radius:50%; background:var(--white);
    box-shadow:0 2px 16px rgba(152,206,200,0.4), 0 0 0 1px var(--hairline) inset;
    display:flex; align-items:center; justify-content:center; padding:10%;
  }
  .center-mark img{ width:100%; height:100%; object-fit:contain; }

  .avatar-wrap{
    position:absolute; top:50%; left:50%;
    cursor:pointer; user-select:none; z-index:10;
  }
  .avatar-wrap .avatar{
    width:100%; height:100%; border-radius:50%; overflow:hidden; position:relative;
    display:flex; align-items:center; justify-content:center;
    background:var(--mint); color:var(--charcoal-dark);
    font-family:'Montserrat',sans-serif; font-weight:700;
    border-style:solid; border-color:var(--hairline);
    transition:box-shadow .25s, transform .25s;
    box-shadow:0 2px 8px rgba(77,77,77,0.10);
  }
  .avatar-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .avatar-wrap .status-dot{ position:absolute; right:0; bottom:0; border-radius:50%; border:2px solid var(--white); }

  .bucket-csuite .avatar{ border-color:var(--teal); }
  .bucket-operations .avatar{ border-color:var(--p-morningglory); }
  .bucket-sales .avatar{ border-color:var(--p-poppy); }
  .bucket-clinical .avatar{ border-color:var(--p-rose); }
  .bucket-finance .avatar{ border-color:var(--p-sunflower); }
  .bucket-hr .avatar{ border-color:var(--p-lavender); }
  .bucket-facilities .avatar{ border-color:var(--p-bellsofireland); }

  .avatar-wrap:hover .avatar{ box-shadow:0 0 0 5px rgba(152,206,200,0.35), 0 2px 8px rgba(77,77,77,0.12); transform:scale(1.08); }
  .avatar-wrap.active .avatar{ box-shadow:0 0 0 6px rgba(152,206,200,0.55), 0 2px 10px rgba(77,77,77,0.16); }
  .avatar-wrap.dimmed{ opacity:0.28; }

  .label-wrap{
    position:absolute; top:50%; left:50%;
    cursor:pointer; user-select:none; z-index:9;
    font-family:'Montserrat',sans-serif; font-weight:600; color:var(--charcoal-dark);
    white-space:nowrap; transition:color .2s, background .2s;
    overflow:hidden; text-overflow:ellipsis;
    background:rgba(255,255,255,0.82); padding:2px 7px; border-radius:20px;
    box-shadow:0 1px 4px rgba(77,77,77,0.12);
  }
  .label-wrap:hover, .label-wrap.active{ color:var(--charcoal-dark); font-weight:700; background:var(--white); box-shadow:0 2px 8px rgba(152,206,200,0.5);}
  .label-wrap.dimmed{ opacity:0.22; }

  .dot-ready{ background:var(--charcoal); }
  .dot-progress{ background:var(--muted); }
  .dot-pending{ background:var(--white); border:2px solid var(--hairline) !important; }

  .detail-panel{
    position:fixed; top:0; right:0; height:100%; width:390px; max-width:88vw;
    background:var(--white);
    border-left:1px solid var(--hairline);
    box-shadow:-8px 0 30px rgba(77,77,77,0.10);
    transform:translateX(100%); transition:transform .38s cubic-bezier(.16,.84,.44,1);
    z-index:50; padding:32px 28px; overflow-y:auto;
  }
  .detail-panel.open{ transform:translateX(0); }
  .detail-panel .close-btn{
    position:absolute; top:22px; right:24px; background:none; border:none;
    color:var(--muted); font-family:'Montserrat',sans-serif; font-weight:600; font-size:11px;
    letter-spacing:0.08em; cursor:pointer; padding:6px;
  }
  .detail-panel .close-btn:hover{ color:var(--charcoal-dark); }
  .dp-photo-wrap{ margin-bottom:20px; }
  .dp-photo{
    width:92px; height:92px; border-radius:50%; overflow:hidden; object-fit:cover;
    border:2.5px solid var(--teal); display:block;
  }
  .dp-photo-fallback{
    width:92px; height:92px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--mint); border:2.5px solid var(--teal);
    font-family:'Montserrat',sans-serif; font-weight:700; font-size:25px; color:var(--charcoal-dark);
  }
  .dp-tier-eyebrow{
    font-family:'Montserrat',sans-serif; font-weight:700; font-size:10.5px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--teal); margin:0 0 10px 0;
  }
  .dp-name{ font-family:'Playfair Display',serif; font-weight:900; font-size:28px; color:var(--charcoal-dark); margin:0 0 3px 0; line-height:1.15;}
  .dp-title{ font-family:'Montserrat',sans-serif; font-weight:500; font-size:14px; color:var(--charcoal); margin:0 0 6px 0; }
  .dp-dept{ display:inline-flex; align-items:center; gap:7px; font-family:'Montserrat',sans-serif; font-weight:600; font-size:11px; color:var(--charcoal); margin:0 0 22px 0; }
  .dp-dept .sw{ width:9px; height:9px; border-radius:50%; flex:none; }
  .dp-section{ margin-bottom:18px; }
  .dp-label{ font-family:'Montserrat',sans-serif; font-weight:700; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin:0 0 6px 0; }
  .dp-body{ font-family:'Montserrat',sans-serif; font-weight:400; font-size:13.5px; line-height:1.6; color:var(--charcoal); margin:0; }
  .dp-quote{ font-family:'Playfair Display',serif; font-style:italic; font-weight:400; font-size:15px; line-height:1.55; color:var(--charcoal-dark); margin:0; }
  .dp-empty{ font-family:'Montserrat',sans-serif; font-size:13px; color:var(--muted); font-style:italic; line-height:1.6; }
  .dp-status-pill{
    display:inline-flex; align-items:center; gap:7px;
    font-family:'Montserrat',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--charcoal); background:var(--mint); border-radius:20px; padding:6px 13px;
    margin-top:4px;
  }
  .dp-status-pill .sw{ width:8px; height:8px; border-radius:50%; }

  .scrim{
    position:fixed; inset:0; background:rgba(77,77,77,0.25); opacity:0; pointer-events:none;
    transition:opacity .3s; z-index:40;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }

  @media (max-width: 640px){
    .masthead{ padding:16px 16px 0 16px; }
    .masthead p.sub{ display:none; }
    .legend{ left:14px; bottom:14px; font-size:9.5px; padding:9px 11px; gap:5px; max-width:175px;}
    .footer-credit{ bottom:10px; }
    .detail-panel{ width:100%; max-width:100%; padding:26px 22px; }
  }
</style>
</head>

function dotClass(status){
  const g = STATUS_META[status] ? STATUS_META[status].group : "pending";
  return g === "ready" ? "dot-ready" : g === "progress" ? "dot-progress" : "dot-pending";
}

// ---------- Layout system: single base design, uniformly scaled, verified non-overlapping ----------
// BASE numbers (at scale=1) were checked to leave a positive gap between every adjacent avatar on
// a ring AND between each ring's outer edge (avatar + label) and the next ring's inner edge.
const BASE = {
  icon: 56,
  tiers: {
    csuite: { avatar: 76, R: 120, labelH: 22, font: 14, maxW: 150 },
    vp:     { avatar: 58, R: 245, labelH: 19, font: 12, maxW: 130 },
    dm:     { avatar: 46, R: 365, labelH: 17, font: 10.5, maxW: 115 },
  },
  labelGap: 10,
  diameter: 900, // outer footprint incl. dm label, plus a little breathing room
};

const plane = document.getElementById("orbitPlane");
const csuite = PEOPLE.filter(p => p.tier === "csuite");
const vps = PEOPLE.filter(p => p.tier === "vp");
const dms = PEOPLE.filter(p => p.tier === "dm");

let SCALE = 1;
function computeScale(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const reservedV = 170; // masthead + footer breathing room
  const avail = Math.min(vw - 40, vh - reservedV);
  let s = avail / BASE.diameter;
  s = Math.max(0.42, Math.min(1.05, s));
  return s;
}

function makeAvatar(p, tier){
  const wrap = document.createElement("div");
  wrap.className = "avatar-wrap bucket-" + p.bucket;
  wrap.dataset.id = p.id;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  if (p.photoData){
    const img = document.createElement("img");
    img.src = "data:image/jpeg;base64," + p.photoData;
    img.alt = p.name;
    avatar.appendChild(img);
  } else {
    avatar.textContent = p.initials;
  }
  const dot = document.createElement("span");
  dot.className = "status-dot " + dotClass(p.status);
  avatar.appendChild(dot);
  wrap.appendChild(avatar);
  wrap.addEventListener("click", () => selectPerson(p.id));
  return wrap;
}
function makeLabel(p){
  const el = document.createElement("div");
  el.className = "label-wrap";
  el.dataset.id = p.id;
  el.textContent = p.first;
  el.addEventListener("click", () => selectPerson(p.id));
  return el;
}

const csuiteEls = csuite.map((p,i) => ({ p, angle: (i/csuite.length)*Math.PI*2 - Math.PI/2, avatar: makeAvatar(p,"csuite"), label: makeLabel(p) }));
const vpEls     = vps.map((p,i)   => ({ p, angle: (i/vps.length)*Math.PI*2, avatar: makeAvatar(p,"vp"), label: makeLabel(p) }));
const dmEls     = dms.map((p,i)   => ({ p, angle: (i/dms.length)*Math.PI*2 + 0.3, avatar: makeAvatar(p,"dm"), label: makeLabel(p) }));
[...csuiteEls, ...vpEls, ...dmEls].forEach(e => { plane.appendChild(e.avatar); plane.appendChild(e.label); });

function place(el, cx, cy, size){
  el.style.width = size + "px";
  el.style.height = size + "px";
  el.style.transform = `translate(${cx - size/2}px, ${cy - size/2}px)`;
}

// Anchors the label to the OUTSIDE edge of its avatar and grows away from it,
// so text never swings back over the photo it belongs to, at any angle or
// name length. Horizontal-dominant angles anchor left/right; vertical-dominant
// angles anchor top/bottom. Direction always points away from the center.
function placeLabelSmart(el, avatarCx, avatarCy, avatarRadius, gap, fontPx, maxW, dx, dy){
  el.style.fontSize = fontPx + "px";
  el.style.maxWidth = maxW + "px";
  const off = avatarRadius + gap;
  if (Math.abs(dx) >= Math.abs(dy)){
    if (dx >= 0){
      el.style.left = (avatarCx + off) + "px"; el.style.top = avatarCy + "px";
      el.style.transform = "translate(0, -50%)"; el.style.textAlign = "left";
    } else {
      el.style.left = (avatarCx - off) + "px"; el.style.top = avatarCy + "px";
      el.style.transform = "translate(-100%, -50%)"; el.style.textAlign = "right";
    }
  } else {
    if (dy < 0){
      el.style.left = avatarCx + "px"; el.style.top = (avatarCy - off) + "px";
      el.style.transform = "translate(-50%, -100%)"; el.style.textAlign = "center";
    } else {
      el.style.left = avatarCx + "px"; el.style.top = (avatarCy + off) + "px";
      el.style.transform = "translate(-50%, 0%)"; el.style.textAlign = "center";
    }
  }
}

function layout(){
  SCALE = computeScale();
  const s = SCALE;
  const iconSize = BASE.icon * s;
  centerMark.style.width = iconSize + "px";
  centerMark.style.height = iconSize + "px";

  const cfg = {};
  for (const tier of ["csuite","vp","dm"]){
    const b = BASE.tiers[tier];
    cfg[tier] = {
      avatar: b.avatar * s,
      R: b.R * s,
      avatarRadius: (b.avatar/2) * s,
      gap: BASE.labelGap * s,
      font: Math.max(b.font * s, 9.5),
      maxW: b.maxW * s,
    };
  }

  ringVP.style.width = ringVP.style.height = (cfg.vp.R * 2) + "px";
  ringDM.style.width = ringDM.style.height = (cfg.dm.R * 2) + "px";

  csuiteEls.forEach(({angle, avatar, label}) => {
    const dx = Math.cos(angle), dy = Math.sin(angle);
    const x = dx * cfg.csuite.R, y = dy * cfg.csuite.R;
    place(avatar, x, y, cfg.csuite.avatar);
    placeLabelSmart(label, x, y, cfg.csuite.avatarRadius, cfg.csuite.gap, cfg.csuite.font, cfg.csuite.maxW, dx, dy);
  });

  window.__cfg = cfg; // used by animate()
}

let vpRot = 0, dmRot = 0;
const VP_SPEED = 0.00009;
const DM_SPEED = -0.00006;
let lastT = null;
let paused = false;

function animate(t){
  if (lastT === null) lastT = t;
  const dt = t - lastT;
  lastT = t;
  if (!paused){ vpRot += VP_SPEED*dt; dmRot += DM_SPEED*dt; }
  const cfg = window.__cfg;
  vpEls.forEach(({angle, avatar, label}) => {
    const a = angle + vpRot; const dx = Math.cos(a), dy = Math.sin(a);
    const x = dx*cfg.vp.R, y = dy*cfg.vp.R;
    place(avatar, x, y, cfg.vp.avatar);
    placeLabelSmart(label, x, y, cfg.vp.avatarRadius, cfg.vp.gap, cfg.vp.font, cfg.vp.maxW, dx, dy);
  });
  dmEls.forEach(({angle, avatar, label}) => {
    const a = angle + dmRot; const dx = Math.cos(a), dy = Math.sin(a);
    const x = dx*cfg.dm.R, y = dy*cfg.dm.R;
    place(avatar, x, y, cfg.dm.avatar);
    placeLabelSmart(label, x, y, cfg.dm.avatarRadius, cfg.dm.gap, cfg.dm.font, cfg.dm.maxW, dx, dy);
  });
  requestAnimationFrame(animate);
}

layout();
requestAnimationFrame(animate);
window.addEventListener("resize", layout);

// ---------- selection + detail panel ----------
const panel = document.getElementById("detailPanel");
const scrim = document.getElementById("scrim");
const detailContent = document.getElementById("detailContent");
const closeBtn = document.getElementById("closeBtn");

function allEls(){
  return [...csuiteEls, ...vpEls, ...dmEls].flatMap(e => [e.avatar, e.label]);
}
function selectPerson(id){
  paused = true;
  const p = PEOPLE.find(x => x.id === id);
  allEls().forEach(el => {
    el.classList.toggle("active", el.dataset.id === id);
    el.classList.toggle("dimmed", el.dataset.id !== id);
  });
  renderDetail(p);
  panel.classList.add("open");
  scrim.classList.add("open");
}
function clearSelection(){
  paused = false;
  allEls().forEach(el => { el.classList.remove("active"); el.classList.remove("dimmed"); });
  panel.classList.remove("open");
  scrim.classList.remove("open");
}
closeBtn.addEventListener("click", clearSelection);
scrim.addEventListener("click", clearSelection);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") clearSelection(); });

const TIER_LABEL = { csuite: "C-Suite", vp: "Vice President", dm: "Director / Manager" };

function renderDetail(p){
  const meta = STATUS_META[p.status] || STATUS_META["not-sent"];
  const photoHtml = p.photoData
    ? `<img class="dp-photo" src="data:image/jpeg;base64,${p.photoData}" alt="${p.name}">`
    : `<div class="dp-photo-fallback">${p.initials}</div>`;
  const hasContent = p.scope || p.tenure || p.achievement || p.quote;
  let body = "";
  if (p.scope) body += `<div class="dp-section"><p class="dp-label">Scope</p><p class="dp-body">${p.scope}</p></div>`;
  if (p.tenure) body += `<div class="dp-section"><p class="dp-label">Tenure</p><p class="dp-body">${p.tenure}</p></div>`;
  if (p.achievement) body += `<div class="dp-section"><p class="dp-label">Key achievement</p><p class="dp-body">${p.achievement}</p></div>`;
  if (p.quote) body += `<div class="dp-section"><p class="dp-label">In their words</p><p class="dp-quote">${p.quote}</p></div>`;
  if (!hasContent) body = `<div class="dp-section"><p class="dp-empty">Profile intake pending — details will populate here once a response comes in.</p></div>`;
  detailContent.innerHTML = `
    <div class="dp-photo-wrap">${photoHtml}</div>
    <p class="dp-tier-eyebrow">${TIER_LABEL[p.tier]}</p>
    <h2 class="dp-name">${p.name}</h2>
    <p class="dp-title">${p.title}</p>
    <p class="dp-dept"><span class="sw" style="background:${BUCKET_COLOR[p.bucket]};"></span>${p.bucketLabel}${p.dept ? " — " + p.dept : ""}</p>
    ${body}
    <div class="dp-status-pill"><span class="sw ${dotClass(p.status)}"></span>${meta.label}</div>
  `;
}
</script>
</body>
